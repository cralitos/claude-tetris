name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: claude-issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Issue Triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio
            (Tetris en JavaScript vanilla — ver CLAUDE.md para la arquitectura:
            board model, pieces/rotación, collide, wall kicks, game loop, locking,
            scoring/leveling, rendering).

            Tareas:
            1. Lee el título y el cuerpo del issue.
            2. Asigna las labels apropiadas usando `gh issue edit ${{ github.event.issue.number }} --add-label "<label>"`,
               eligiendo SOLO entre estas labels existentes (no crees labels nuevas):
               bug, accessibility, documentation, duplicate, enhancement,
               good first issue, help wanted, invalid, question, wontfix.
               No quites labels ya asignadas salvo que sean claramente incorrectas.
            3. Publica un comentario NUEVO en el issue con
               `gh issue comment ${{ github.event.issue.number }} --body "..."`
               que contenga un diagnóstico general (no código todavía):
               - Resumen del problema/petición en 1-2 frases.
               - Componente(s) probablemente afectado(s) dentro de game.js /
                 index.html / style.css, según la arquitectura de CLAUDE.md.
               - Hipótesis de causa raíz (si es bug) o enfoque de alto nivel
                 (si es feature).
               - Preguntas o ambigüedades a resolver antes de implementar.
          claude_args: >-
            --allowedTools "Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"
